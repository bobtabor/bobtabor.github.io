<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            color: #333;
            font-size: clamp(24px, 5vw, 36px);
            margin-bottom: 30px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin: 20px 0;
        }
        a {
            display: block;
            color: #0066cc;
            text-decoration: none;
            font-size: clamp(18px, 4vw, 24px);
            padding: 15px 20px;
            background: #f5f5f5;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        a:hover {
            background: #e8f4ff;
            border-color: #0066cc;
            text-decoration: none;
        }
        a:active {
            transform: scale(0.98);
        }
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            li {
                margin: 15px 0;
            }
            a {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <h1>Reports</h1>
    <ul>
        <li><a href="/rankings/">Basket Rankings</a></li>
        <li><a href="/scorecard-days/">Scorecard Days</a></li>
        <li><a href="/scorecard-quarters/">Scorecard Quarters</a></li>
    </ul>
</body>
</html>
